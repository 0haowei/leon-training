<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10171c"><title>Leon Training｜训练与饮食</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Leon训练"><meta name="description" content="Leon个人网球、体能与饮食训练卡片"><style>:root{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#eaf0f2;background:#10171c}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;background:#10171cf2;z-index:5;padding:calc(14px + env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid #2d383e}.brand{font-size:22px;font-weight:800;letter-spacing:.2px}.sub{color:#96a6ae;font-size:12px;margin-top:4px}.days{display:flex;gap:7px;overflow:auto;padding-top:15px;scrollbar-width:none}.day{border:1px solid #34424a;background:#1b272d;color:#d1dce0;border-radius:13px;min-width:43px;height:43px;font-size:15px}.day.active{background:#b5f1cb;color:#12261b;border-color:#b5f1cb;font-weight:800}main{max-width:600px;margin:auto;padding:18px 15px 95px}.summary{background:linear-gradient(135deg,#233d39,#1b292f);border:1px solid #3a6155;border-radius:20px;padding:18px;margin-bottom:17px}.eyebrow{font-size:12px;color:#b1e5cd}.big{font-size:25px;font-weight:800;margin:7px 0}.muted{color:#9eb0b9;font-size:13px;line-height:1.6}.section{font-size:18px;font-weight:800;margin:22px 4px 12px}.card{border-radius:18px;background:#1b272d;border:1px solid #324049;padding:15px;margin:11px 0}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-size:17px;font-weight:750}.time{color:#b7e5ce;font-size:13px;white-space:nowrap}.desc{font-size:13px;color:#b6c3c9;line-height:1.65;margin:9px 0}.drill{display:flex;gap:12px;align-items:center;border-top:1px solid #324049;padding:12px 0}.drill:first-child{border-top:0}.art{flex:0 0 78px;width:78px;height:76px;background:#263940;border-radius:13px;display:grid;place-items:center}.art svg{width:70px;height:65px}.dcontent{flex:1;min-width:0}.dname{font-size:15px;font-weight:700}.dmeta{font-size:13px;color:#b6d8c5;margin-top:4px}.dhelp{font-size:12px;color:#9eb0b9;line-height:1.55;margin-top:5px}.tick{width:24px;height:24px;accent-color:#b5f1cb;flex:0 0 auto}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.metric{background:#283940;border-radius:14px;padding:13px 8px;text-align:center}.num{font-size:24px;font-weight:850}.unit{font-size:12px;color:#a5b5bd}.pill{font-size:11px;padding:5px 9px;border-radius:30px;background:#355244;color:#c9f5d9}.food{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #324049}.food:last-child{border-bottom:0}.foodicon{font-size:32px;background:#2b3c42;border-radius:13px;width:55px;height:55px;display:grid;place-items:center}.foodname{font-weight:700;font-size:14px}.fooddesc{font-size:12px;color:#aab9bf;margin-top:5px;line-height:1.6}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#162126f5;border-top:1px solid #33434a;padding:10px 15px calc(10px + env(safe-area-inset-bottom));gap:8px;z-index:6}.nav button{flex:1;border:0;border-radius:13px;background:#2a3a40;color:#d7e3e7;padding:12px 4px;font-weight:700}.nav button.sel{background:#b5f1cb;color:#12261b}.note{background:#3a3328;border:1px solid #756044;color:#eed6a7;border-radius:13px;padding:12px;font-size:12px;line-height:1.65;margin:12px 0}button{cursor:pointer}.reset{border:1px solid #43545b;background:transparent;color:#bdcbd1;border-radius:10px;padding:9px 12px;margin-top:10px}.hide{display:none}.expert{display:inline-block;margin-top:9px;padding:9px 11px;border:1px solid #4a786a;border-radius:9px;background:#1d3530;color:#baf1d3;text-decoration:none;font-size:12px;font-weight:650;line-height:1.4}.expert:active{opacity:.65} .tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.tools button,.tools label{border:1px solid #49605f;background:#223a39;color:#d6f5e5;border-radius:11px;padding:10px 12px;font-size:13px;font-weight:650}.tools input[type=file]{display:none}.weightline{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12px;color:#b4c6c8}.weightline input{min-width:0;width:96px;border:1px solid #536b70;border-radius:8px;background:#102025;color:white;padding:8px;font-size:16px}.datebar{display:flex;align-items:center;gap:9px;margin:12px 0 0;font-size:13px;color:#c5d5d8}.datebar input{color:#eaf0f2;background:#263940;border:1px solid #536b70;border-radius:8px;padding:8px;font-size:16px;max-width:170px}.status{color:#a6c9b8;font-size:12px;margin-top:8px;line-height:1.5} </style><link rel="stylesheet" href="./calendar.css"></head><body><header><div class="brand">LEON <span style="color:#b5f1cb">/</span> 训练系统</div><div class="sub">网球 · 力量 · 饮食｜北京时间｜离线可用</div><div class="datebar"><label for="datePick">训练日期</label><input type="date" id="datePick"><button class="day" id="todayBtn" style="width:auto;padding:0 10px">今天</button></div><div class="days" id="days"></div></header><main><section class="card"><div class="title">训练记录与备份</div><div class="desc">勾选和重量按实际日期保存于本机。建议每周导出 JSON 备份；清理网站数据或更换设备可能丢失本机记录。</div><div class="tools"><button id="exportBtn">↓ 导出 JSON</button><label for="importFile">↑ 导入 JSON</label><input type="file" id="importFile" accept="application/json,.json"></div><div class="status" id="saveStatus" role="status">本机存储 · 无云端同步</div></section><div id="app"></div></main><nav class="nav"><button data-tab="all" class="sel">今日总览</button><button data-tab="tennis">🎾 网球</button><button data-tab="fitness">🏋️ 体能</button><button data-tab="food">🍜 饮食</button></nav><script>
const names=['周日','周一','周二','周三','周四','周五','周六'];
const TZ='Asia/Shanghai';
function chinaToday(){return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()).replace(/\//g,'-')}
function weekDay(iso){const [y,m,d]=iso.split('-').map(Number);return new Date(Date.UTC(y,m-1,d)).getUTCDay()}
let activeDate=chinaToday(),selected=weekDay(activeDate),tab='all';
const STORE='leon-training-v2:';
function safeGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function safeSet(k,v){try{localStorage.setItem(k,v);document.getElementById('saveStatus').textContent='已保存到本机 · '+new Date().toLocaleTimeString('zh-CN')}catch(e){document.getElementById('saveStatus').textContent='存储失败：请检查浏览器是否允许本地存储'}}
function entryKey(type,index,i,field){return STORE+activeDate+':'+type+':'+index+':'+i+':'+field}

const targets=[[125,360,75],[120,280,75],[125,350,75],[125,330,75],[120,300,75],[120,280,75],[125,360,75]];
const svg=(type)=>{let poses={squat:'M35 12a7 7 0 1 0 0 14a7 7 0 0 0 0-14 M35 26L32 43 22 51 11 51 M32 43L45 51 57 51 M33 30L20 39 M33 30L47 37',hinge:'M25 12a7 7 0 1 0 0 14a7 7 0 0 0 0-14 M25 27L45 40 53 54 M45 40L28 53 17 53 M35 34L48 51',curl:'M35 10a7 7 0 1 0 0 14a7 7 0 0 0 0-14 M35 24L35 43 22 57 M35 43L49 49 54 36 M35 30L22 39',calf:'M34 10a7 7 0 1 0 0 14a7 7 0 0 0 0-14 M34 24L34 44 25 59 18 59 M34 44L44 57 55 57 M34 28L23 36',row:'M28 11a7 7 0 1 0 0 14a7 7 0 0 0 0-14 M28 26L39 43 45 57 M39 43L23 57 M34 33L50 30 60 33',press:'M35 12a7 7 0 1 0 0 14a7 7 0 0 0 0-14 M35 26L35 45 24 60 M35 45L47 60 M35 30L19 21 M35 30L51 21',lunge:'M35 11a7 7 0 1 0 0 14a7 7 0 0 0 0-14 M35 25L35 43 18 51 8 51 M35 43L50 50 58 62 M35 30L21 38',tennis:'M31 10a7 7 0 1 0 0 14a7 7 0 0 0 0-14 M31 25L39 43 23 58 M39 43L55 57 M36 30L54 21 M54 21L64 11 M17 13a5 5 0 1 0 0 10a5 5 0 0 0 0-10'};return `<svg viewBox="0 0 72 70" fill="none" stroke="#b5f1cb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 64H67" stroke="#5a7774"/> <path d="${poses[type]||poses.tennis}"/></svg>`};
const D=(n,detail,meta,kind='tennis')=>({n,detail,meta,kind});
const plan={0:{fitness:[{title:'高强度教练课后的恢复',time:'按需',drills:[D('轻松散步','促进舒适活动，不追求出汗','20–30分钟','calf')]}],tennis:[{title:'固定高强度教练课',time:'10:00–11:30',drills:[D('教练安排的技术与对抗','重点关注移动击球、Recover；出现疼痛及时调整','90分钟')]}]},1:{fitness:[{title:'主动恢复',time:'10:00–10:30',drills:[D('轻松步行或骑车','保持能够正常说话的强度','20分钟','calf'),D('髋、膝、踝活动','缓慢、无痛范围内活动','10分钟','lunge')]}]},2:{fitness:[{title:'主要下肢力量',time:'09:30–10:30',drills:[D('动态热身','轻松骑车、髋踝活动、徒手蹲','8分钟','lunge'),D('深蹲','双脚约肩宽，屈髋屈膝下蹲，膝盖朝脚尖方向','3组 × 6–8次','squat'),D('罗马尼亚硬拉 RDL','膝微屈，臀部向后推，背部保持自然中立','3组 × 8次','hinge'),D('腿弯举','器械上缓慢弯曲膝盖，控制回放','2组 × 10–12次','curl'),D('站姿提踵','脚跟缓慢抬高再落下，不弹震','3组 × 12–15次','calf'),D('Pallof Press','弹力带从胸前推直，抵抗躯干旋转','2组 × 10次/侧','press')]}],tennis:[{title:'球友对拉',time:'17:00–18:30',drills:[D('小场热身','先慢速对拉逐渐进入节奏','10分钟'),D('正手斜线','稳定深度，提前转肩','15分钟'),D('反手斜线','找准击球点，维持节奏','15分钟'),D('直线与变线','保持稳定重心','15分钟'),D('随机落点与脚步','Split Step → 找球 → 击球 → Recover','20分钟'),D('控制性实战','不追求每拍爆发','10分钟'),D('放松','走动、总结','5分钟')]}]},3:{tennis:[{title:'发球专项',time:'09:00–10:00',drills:[D('肩部热身与空挥','低速完整动作，不追求拍头速度','10分钟'),D('抛球与连续节奏','把抛球、奖杯、蹬腿连贯起来','15分钟'),D('二发旋转与落点','优先安全过网高度和稳定性','15分钟'),D('一发落点','一区、二区交替，不连续全力发球','15分钟'),D('录像与复盘','记录抛球位置和身体感觉','5分钟')]},{title:'教朋友打球',time:'10:00–11:00',drills:[D('动态热身与脚步','交叉步、急停与启动','10分钟'),D('正手转肩与引拍','强调非持拍手辅助转肩','15分钟'),D('判断弹跳','手抛球喂球，寻找舒适击球点','15分钟'),D('移动击球与回位','从固定击球逐步过渡到移动击球','15分钟'),D('总结','反馈1–2个重点','5分钟')]}]},4:{fitness:[{title:'上肢与核心',time:'建议10:00–11:00',drills:[D('肩胛热身','轻弹力带动作，控制肩胛','8分钟','row'),D('胸托划船','胸部贴靠支撑，肘向后拉','3组 × 8–12次','row'),D('高位下拉','肩胛先稳定，拉向上胸附近','3组 × 8–12次','row'),D('中立握哑铃卧推','掌心相对，动作在无痛范围内','2组 × 8–10次','press'),D('肩袖外旋','肘靠近身体，缓慢向外旋转','2组 × 12–15次','press'),D('Dead Bug','仰卧交替伸展对侧手脚，腰背稳定','3组 × 10次/侧','lunge'),D('侧平板','保持身体一条直线','2组 × 30秒/侧','lunge')]}]},5:{fitness:[{title:'周末前轻激活',time:'建议10:00–10:40',drills:[D('轻松骑车','舒适节奏，不累积疲劳','8分钟','calf'),D('徒手分腿蹲','前后站立，缓慢下蹲','2组 × 8次/侧','lunge'),D('臀桥','仰卧屈膝，抬髋收紧臀部','2组 × 12次','hinge'),D('弹力带侧移','膝微屈，小步侧移','2组 × 12步/侧','lunge'),D('轻量提踵','缓慢抬脚跟','2组 × 12次','calf'),D('髋踝活动','轻松活动，无疼痛','8分钟','lunge')]}]},6:{tennis:[{title:'固定高强度教练课',time:'10:00–11:30',drills:[D('教练主导训练','热身、底线技术、移动与对抗；只聚焦一个主要技术目标','90分钟')]}]}};
function foodItems(d){let weekend=d===0||d===6, tuesday=d===2,wed=d===3;return [{icon:'🍌',name:'早餐',desc:weekend||wed?'训练前尽量吃：香蕉1根 + 面包60–80g；时间允许加酸奶150–200g':'香蕉、面包、鸡蛋或酸奶，按当天碳水目标调整'},{icon:'🍚',name:'午餐',desc:'熟米饭250–300g + 熟鸡胸肉120–150g + 蔬菜200g；份量按全天目标调整'},{icon:'🥪',name:'训练前加餐',desc:tuesday?'约16:15，补25–40g易消化碳水':weekend||wed?'早训前优先易消化碳水，避免空腹':'按饥饿和当天训练安排补充'},{icon:'🐟',name:'晚餐',desc:'熟米饭250–300g + 鱼/肉约150g + 蔬菜200g，按目标补足'},{icon:'🥛',name:'加餐',desc:'酸奶约200g + 燕麦约50g + 水果；不足时补主食或蛋白质食物'},{icon:'💧',name:'运动补水',desc:'宝矿力按口渴、天气、出汗量饮用；其中碳水计入全天目标，不必强制喝完'}]}

const expertLinks={
'深蹲':['ACE｜下肢动作库','https://www.acefitness.org/resources/everyone/exercise-library/body-part/legs-thighs/adductors/'],
'罗马尼亚硬拉 RDL':['ACE｜哑铃髋铰链动作','https://www.acefitness.org/resources/everyone/exercise-library/equipment/dumbbells/?page=3'],
'腿弯举':['ACE｜动作资料库','https://www.acefitness.org/resources/everyone/exercise-library/'],
'站姿提踵':['ACE｜小腿训练动作','https://www.acefitness.org/resources/everyone/exercise-library/body-part/legs-calves-and-shins/'],
'Pallof Press':['ACE｜抗旋转练习资料','https://www.acefitness.org/resources/everyone/exercise-library/experience/beginner/'],
'胸托划船':['ACE｜背部训练动作','https://www.acefitness.org/resources/everyone/exercise-library/'],
'高位下拉':['ACE｜背部训练动作','https://www.acefitness.org/resources/everyone/exercise-library/'],
'中立握哑铃卧推':['ACE｜推举训练动作','https://www.acefitness.org/resources/everyone/exercise-library/experience/beginner/'],
'肩袖外旋':['ACE｜肩部动作资料','https://www.acefitness.org/resources/everyone/exercise-library/'],
'Dead Bug':['ACE｜核心动作资料','https://www.acefitness.org/resources/everyone/exercise-library/'],
'侧平板':['ACE｜核心动作资料','https://www.acefitness.org/resources/everyone/exercise-library/'],
'抛球与连续节奏':['USTA｜发球动作教学','https://www.usta.com/en/home/improve/tips-and-instruction/national/learning-the-basics--serve.html'],
'二发旋转与落点':['USTA｜发球变化','https://www.usta.com/en/home/improve/tips-and-instruction/national/quick-tennis-tips--varying-your-serve.html'],
'一发落点':['USTA｜发球落点练习','https://www.usta.com/en/home/improve/tips-and-instruction/national/tennis-techniques--service-placement.html'],
'正手斜线':['USTA｜对拉深度练习','https://www.usta.com/en/home/improve/tips-and-instruction/national/improve-your-tennis-game--target-practice.html'],
'反手斜线':['USTA｜对拉深度练习','https://www.usta.com/en/home/improve/tips-and-instruction/national/improve-your-tennis-game--target-practice.html'],
'直线与变线':['USTA｜线路练习','https://www.usta.com/en/home/improve/tips-and-instruction/national/improve-your-tennis-game--target-practice.html'],
'随机落点与脚步':['USTA｜网球技术资料','https://www.usta.com/en/home/improve/tips-and-instruction.html'],
'判断弹跳':['USTA｜初学者教学','https://www.usta.com/en/home/improve/tips-and-instruction.html']
};
function expertButton(name){let a=expertLinks[name];return a?`<a class="expert" href="${a[1]}" target="_blank" rel="noopener noreferrer">▶ ${a[0]} · 查看示范 ↗</a>`:''}

function card(block,type,index){return `<article class="card"><div class="cardhead"><div class="title">${block.title}</div><div class="time">${block.time}</div></div>${block.drills.map((d,i)=>{let key=entryKey(type,index,i,'done'),checked=safeGet(key)==='1',weightKey=entryKey(type,index,i,'weight'),weight=safeGet(weightKey)||'',isStrength=type==='fitness'&&selected!==1&&selected!==5;return `<div class="drill"><div class="art">${svg(d.kind)}</div><div class="dcontent"><div class="dname">${d.n}</div><div class="dmeta">${d.meta}</div><div class="dhelp">${d.detail}</div>${expertButton(d.n)}${isStrength?`<label class="weightline">本次重量（kg）<input type="number" min="0" max="1000" step="0.5" inputmode="decimal" data-weight="${weightKey}" value="${weight}" placeholder="可选"></label>`:''}</div><input class="tick" type="checkbox" data-key="${key}" ${checked?'checked':''} aria-label="完成 ${d.n}"></div>`}).join('')}</article>`}
function render(){document.getElementById('datePick').value=activeDate;document.querySelector('#days').innerHTML=[1,2,3,4,5,6,0].map(d=>`<button class="day ${d===selected?'active':''}" data-day="${d}">${names[d].slice(1)}</button>`).join('');let [p,c,f]=targets[selected],kcal=p*4+c*4+f*9,parts=[];parts.push(`<div class="summary"><div class="eyebrow">${activeDate} · ${names[selected]} · 每周重复计划</div><div class="big">${selected===2?'力量 + 对拉':selected===3?'发球 + 教学':selected===6||selected===0?'高强度网球':selected===1?'主动恢复':selected===4?'上肢核心':'轻激活'}</div><div class="muted">根据当前60kg体重制定的起始计划；按恢复情况灵活调整。</div></div>`);if(tab==='all'||tab==='food'){parts.push(`<div class="section">🍜 今日营养目标</div><div class="card"><div class="muted">这是全天总量，包括饮料和加餐；不是每顿都吃这么多。</div><div class="metrics"><div class="metric"><div class="num">${p}</div><div class="unit">蛋白质 g</div></div><div class="metric"><div class="num">${c}</div><div class="unit">碳水 g</div></div><div class="metric"><div class="num">${f}</div><div class="unit">脂肪 g</div></div></div><p class="muted">估算热量：约 ${kcal} kcal / 天。按体重变化和训练表现每2–3周调整。</p>${foodItems(selected).map(x=>`<div class="food"><div class="foodicon">${x.icon}</div><div><div class="foodname">${x.name}</div><div class="fooddesc">${x.desc}</div></div></div>`).join('')}</div>`)}if(tab==='all'||tab==='fitness'){let a=plan[selected].fitness||[];if(a.length)parts.push(`<div class="section">🏋️ 体能 / 恢复</div>${a.map((x,i)=>card(x,'fitness',i)).join('')}`)}if(tab==='all'||tab==='tennis'){let a=plan[selected].tennis||[];if(a.length)parts.push(`<div class="section">🎾 网球训练</div>${a.map((x,i)=>card(x,'tennis',i)).join('')}`)}parts.push(`<div class="note">注意：图示为简化动作示意，不是完整教学。初次练习应由教练确认动作。腘窝、肩膀或上臂出现疼痛时，不要强行完成动作。周末课程由教练主导，卡片仅为提醒。</div><button class="reset" id="reset">清空当天勾选记录</button>`);document.querySelector('#app').innerHTML=parts.join('');document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{const offset=(+b.dataset.day-selected+7)%7;const [y,m,d]=activeDate.split('-').map(Number);const date=new Date(Date.UTC(y,m-1,d+offset));activeDate=date.toISOString().slice(0,10);selected=weekDay(activeDate);render()});document.querySelectorAll('.tick').forEach(c=>c.onchange=()=>safeSet(c.dataset.key,c.checked?'1':'0'));document.querySelectorAll('[data-weight]').forEach(input=>input.onchange=()=>safeSet(input.dataset.weight,input.value));document.querySelector('#reset').onclick=()=>{if(confirm('清空'+activeDate+'的训练勾选和重量记录？')){Object.keys(localStorage).filter(k=>k.startsWith(STORE+activeDate+':')).forEach(k=>localStorage.removeItem(k));render()}};document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('sel',b.dataset.tab===tab))}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
document.getElementById('datePick').addEventListener('change',e=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(e.target.value))return;activeDate=e.target.value;selected=weekDay(activeDate);render()});
document.getElementById('todayBtn').onclick=()=>{activeDate=chinaToday();selected=weekDay(activeDate);render()};
document.getElementById('exportBtn').onclick=()=>{const records={};for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key.startsWith(STORE))records[key]=localStorage.getItem(key)}const payload={app:'Leon Training',schema:2,exportedAt:new Date().toISOString(),records};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Leon_训练备份_'+chinaToday()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
document.getElementById('importFile').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>5*1024*1024)throw Error('备份文件过大');const data=JSON.parse(await file.text());if(data.app!=='Leon Training'||data.schema!==2||!data.records||typeof data.records!=='object'||Array.isArray(data.records))throw Error('不是兼容的 Leon 备份文件');const entries=Object.entries(data.records);if(entries.length>100000||entries.some(([k,v])=>!k.startsWith(STORE)||typeof v!=='string'||v.length>500))throw Error('备份内容不符合格式');if(!confirm('将导入 '+entries.length+' 条记录。同名日期记录会被覆盖，是否继续？'))return;entries.forEach(([k,v])=>localStorage.setItem(k,v));document.getElementById('saveStatus').textContent='成功导入 '+entries.length+' 条记录';render()}catch(err){alert('导入失败：'+err.message)}finally{e.target.value=''}};
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script><script src="./calendar.js?v=5"></script></body></html>
